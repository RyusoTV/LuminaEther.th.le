<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LuminaEther Official</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
:root{--bg:#050816;--fg:#e8f1ff;--mut:#8a9bc4;--card:rgba(14,22,48,.72);--line:rgba(80,200,255,.25);--c1:#22d3ee;--c2:#8b5cf6;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4ff;--fg:#0b1430;--mut:#51608a;--card:rgba(255,255,255,.82);--line:rgba(30,90,200,.28)}}
:root[data-theme="light"]{--bg:#eef4ff;--fg:#0b1430;--mut:#51608a;--card:rgba(255,255,255,.82);--line:rgba(30,90,200,.28)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 'Noto Sans Thai',system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font:800 1rem Orbitron,sans-serif;letter-spacing:.12em;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:6px 12px;border-radius:8px;color:var(--mut);cursor:pointer;white-space:nowrap;position:relative;transition:.25s}
nav a:hover{color:var(--fg);text-shadow:0 0 10px var(--c1)}
nav a.on{color:var(--fg)}
nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 10px var(--c1)}
#me{display:flex;gap:6px;align-items:center}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
a{color:var(--c1);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px);transition:.3s;position:relative;overflow:hidden}
.card:hover{border-color:var(--c1);box-shadow:0 0 24px rgba(34,211,238,.18)}
.card p{white-space:pre-wrap;margin:6px 0}.card h3{margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid>.card{margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}.ph h2{font:800 1.3rem Orbitron,'Noto Sans Thai',sans-serif;margin:8px 0 14px}
.btn{background:linear-gradient(90deg,var(--c1),var(--c2));color:#04101f;border:0;border-radius:9px;padding:8px 16px;font:600 14px 'Noto Sans Thai',sans-serif;cursor:pointer;transition:.25s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{box-shadow:0 0 18px var(--c1);transform:translateY(-1px)}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--line)}.sm{padding:4px 10px;font-size:13px}
.mut{color:var(--mut);font-size:13px}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#04101f;font-weight:700;flex:none}
.hd{display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:8px}
.bd{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;margin-left:4px}
.b0{color:var(--mut)}.b1{color:#34d399}.b2{color:#60a5fa}.b3{color:#c084fc}.b4{color:#f5a70b;text-shadow:0 0 8px #f5a70b}
.vf{color:var(--c1);margin-left:4px;font-size:13px}
.md,video{max-width:100%;border-radius:10px;margin:8px 0;display:block}
audio{width:100%;margin-top:6px}blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--c2);background:rgba(127,160,255,.07);border-radius:6px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act button{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}.act button.on{color:var(--bad);border-color:var(--bad)}
.sr{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px}.st{text-align:center;cursor:pointer;flex:none;width:64px}
.st .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c1)}.st small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.add{width:56px;height:56px;border-radius:50%;border:1px dashed var(--c1);display:grid;place-items:center;font-size:24px;color:var(--c1);margin:0 auto 18px}
.cmp{cursor:pointer;color:var(--mut)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(2,6,20,.75);display:grid;place-items:center;padding:16px;overflow:auto;animation:fade .25s}
.box{width:min(480px,100%);max-height:90vh;overflow:auto;margin:0}
label{display:block;margin:8px 0;color:var(--mut);font-size:13px}
input,textarea,select{width:100%;box-sizing:border-box;background:rgba(127,160,255,.08);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit;margin-top:4px}
select{width:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs a{padding:5px 14px;border:1px solid var(--line);border-radius:99px;color:var(--mut)}.tabs a.on{color:var(--fg);border-color:var(--c1);box-shadow:0 0 12px rgba(34,211,238,.3)}
.cv{height:150px;margin:-16px -16px 0;background:linear-gradient(120deg,#0e3a5c,#2a1466);overflow:hidden}.cv img{width:100%;height:100%;object-fit:cover}
.pfh{display:flex;gap:14px;align-items:flex-end;margin-top:-36px;position:relative;flex-wrap:wrap}.pfh .av{border:3px solid var(--bg)}
.ur{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.hero{text-align:center;padding:36px 16px}.hero h1{font:800 clamp(1.7rem,7vw,3.2rem) Orbitron,sans-serif;letter-spacing:.14em;margin:6px 0;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 5s infinite;display:inline-block}
.hero .tag{font:500 .8rem Orbitron,sans-serif;letter-spacing:.3em;color:var(--c1)}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--c1),transparent);animation:scan 3.2s linear infinite}
.stats{display:flex;justify-content:center;gap:28px;margin-top:14px;color:var(--mut)}.stats b{display:block;font:800 1.5rem Orbitron,sans-serif;color:var(--fg)}
.post,.grid>.card{animation:rise .55s both;animation-delay:calc(var(--i,0)*60ms)}
.in>*{animation:rise .55s both}
#wipe{position:fixed;inset:0;z-index:55;pointer-events:none;display:grid;place-items:center;background:repeating-linear-gradient(0deg,rgba(34,211,238,.08) 0 2px,transparent 2px 5px),linear-gradient(120deg,#050816,#14083a);clip-path:inset(0 100% 0 0);font:700 1rem Orbitron,sans-serif;letter-spacing:.3em;color:#22d3ee;text-shadow:0 0 14px #22d3ee;text-align:center}
#wipe.run{animation:wp .85s cubic-bezier(.76,0,.24,1)}
#boot{position:fixed;inset:0;z-index:70;background:#050816;display:grid;place-content:center;gap:14px;text-align:center;color:#22d3ee;font-family:Orbitron,sans-serif;letter-spacing:.3em;animation:boot 2s forwards}
#boot b{font-size:1.5rem;animation:gl 1s infinite}#boot i{display:block;height:3px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);box-shadow:0 0 12px #22d3ee;animation:bar 1.5s ease-out forwards;width:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--c1);padding:8px 18px;border-radius:99px;z-index:80;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}@keyframes scan{to{top:100%}}@keyframes bar{to{width:100%}}
@keyframes boot{0%,82%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes wp{0%{clip-path:inset(0 100% 0 0)}42%,58%{clip-path:inset(0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes gl{0%,92%,100%{transform:none;filter:drop-shadow(0 0 10px var(--c1))}94%{transform:translate(-3px,1px) skewX(6deg);filter:drop-shadow(3px 0 #f0f) drop-shadow(-3px 0 #0ff)}96%{transform:translate(3px,-1px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

.st.sn .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line)}
#sv{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.93);display:grid;place-items:center;animation:fade .2s}
.svb{position:relative;width:min(420px,100vw);height:min(100dvh,820px);background:#000;border-radius:14px;overflow:hidden;color:#fff;user-select:none}
.svm{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.svp{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px;z-index:4}.svp i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}.svp b{display:block;height:100%;background:#fff}
.svh{position:absolute;top:0;left:0;right:0;padding:20px 10px 24px;display:flex;gap:8px;align-items:center;z-index:4;background:linear-gradient(rgba(0,0,0,.6),transparent);text-shadow:0 1px 4px #000}
.svh button,.svf button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;font-family:inherit}
.svt{position:absolute;left:0;right:0;bottom:90px;padding:0 18px;text-align:center;font-size:1.05rem;text-shadow:0 1px 6px #000;z-index:2;white-space:pre-wrap}
.svt.big{top:0;bottom:0;display:grid;place-content:center;font-size:1.6rem;font-weight:600}
.svc{position:absolute;left:12px;bottom:70px;z-index:3;background:rgba(0,0,0,.55);padding:3px 12px;border-radius:99px;font-size:13px}
.svz{position:absolute;top:70px;bottom:100px;width:35%;z-index:3}
.svf{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 12px;display:flex;gap:8px;align-items:center;z-index:4;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.svf input{flex:1;margin:0;border-radius:99px;background:rgba(0,0,0,.4);color:#fff;border:1px solid rgba(255,255,255,.6);padding:9px 14px}
.svs{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--bg);color:var(--fg);padding:14px;border-radius:16px 16px 0 0;transform:translateY(101%);transition:.3s;z-index:6}.svs.on{transform:none}
.rl{height:calc(100dvh - 190px);min-height:420px;max-width:400px;margin:0 auto;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.rc{position:relative;height:100%;margin-bottom:12px;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line);color:#fff}
.rc video{width:100%;height:100%;object-fit:cover;display:block;margin:0;border-radius:0}
.ri{position:absolute;left:0;right:60px;bottom:0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));text-shadow:0 1px 4px #000}
.rs{position:absolute;right:6px;bottom:20px;display:grid;gap:12px;justify-items:center}
.rs button{background:rgba(0,0,0,.45);border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:19px;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1}.rs button.on{color:var(--bad)}.rs small{font-size:10px;line-height:1}
.cv.adj{cursor:grab;touch-action:none;outline:2px dashed var(--c1);outline-offset:-2px}.cv.adj img{pointer-events:none}

header{animation:dn .6s cubic-bezier(.2,.8,.2,1)}@keyframes dn{from{transform:translateY(-100%);opacity:0}}
.post,.grid>.card{animation:none}.noa>*{animation:none}
.rv{opacity:0;transform:translateY(24px) scale(.98)}.rv.vis{opacity:1;transform:none;transition:opacity .55s,transform .55s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;transition-delay:calc(min(var(--i,0),6)*60ms)}
.box{animation:mi .35s cubic-bezier(.2,.9,.3,1.2)}@keyframes mi{from{opacity:0;transform:translateY(24px) scale(.92)}}
.ov.out{animation:fo .18s forwards}.ov.out .box{transform:scale(.94);opacity:0;transition:.18s}@keyframes fo{to{opacity:0}}
.btn:active,.act button:active,.st:active,.rs button:active,.svq button:active{transform:scale(.9)}
.st{transition:transform .2s}.st:hover{transform:translateY(-3px)}.sr .st{animation:rise .5s both}.noa .sr .st{animation:none}
.st:not(.sn) .av{animation:rp 2.2s ease-in-out infinite}@keyframes rp{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c2),0 0 16px var(--c1)}}
.act button,.tabs a,nav a{transition:.2s}.act button:hover{border-color:var(--c1);transform:translateY(-1px)}
.act button.on.pop,.rs button.on.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.55)}70%{transform:scale(.9)}}
.in:not(.noa) .rc{animation:rise .6s both}
@keyframes ko{from{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0;border-radius:50%}}
@keyframes kn{from{transform:perspective(900px) rotateY(70deg) translateX(40%);opacity:.2}}
@keyframes kp{from{transform:perspective(900px) rotateY(-70deg) translateX(-40%);opacity:.2}}
@keyframes ku{from{transform:perspective(900px) rotateY(90deg) scale(.8);opacity:0}}
.a-o{animation:ko .45s cubic-bezier(.2,.8,.2,1)}.a-n{animation:kn .35s ease-out}.a-p{animation:kp .35s ease-out}.a-u{animation:ku .5s ease-out}
#sv.out{animation:fo .25s forwards}#sv.out .svb{transform:scale(.9) translateY(30px);transition:.25s}.svb{touch-action:none}
.svt{animation:rise .5s .15s both}.svh{animation:dn .4s both}.svc{animation:rise .5s .25s both}
.svq{position:absolute;left:0;right:0;bottom:62px;display:flex;justify-content:center;gap:6px;z-index:5}.svq button{background:rgba(0,0,0,.4);border:0;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer;animation:rise .4s both;transition:.15s}.svq button:nth-child(2){animation-delay:.05s}.svq button:nth-child(3){animation-delay:.1s}.svq button:nth-child(4){animation-delay:.15s}.svq button:nth-child(5){animation-delay:.2s}.svq button:nth-child(6){animation-delay:.25s}
.svc{bottom:112px}.svt{bottom:150px}.svt.big{bottom:0}
.fl{position:fixed;z-index:90;font-size:34px;pointer-events:none;transform:translate(-50%,0);animation:fl 1.1s ease-out forwards}@keyframes fl{to{transform:translate(-50%,-180px) scale(1.6);opacity:0}}
.hb{position:fixed;z-index:90;font-size:84px;pointer-events:none;transform:translate(-50%,-50%);animation:hb .8s ease-out forwards}@keyframes hb{0%{transform:translate(-50%,-50%) scale(0)}30%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.nw{position:relative;display:inline-block}.nt{position:absolute;left:50%;bottom:100%;margin-bottom:8px;width:max-content;max-width:190px;transform:translateX(-50%);background:var(--card);border:1px solid var(--c1);border-radius:14px;padding:3px 12px;font-size:13px;box-shadow:0 0 14px rgba(34,211,238,.3);animation:bob 3s ease-in-out infinite;z-index:2;cursor:pointer}.nt::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--card);border:solid var(--c1);border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.nb{max-width:64px;margin:0 auto 4px;padding:1px 8px;font-size:11px;border:1px solid var(--c1);border-radius:10px;background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:bob 3s ease-in-out infinite}

/* ===== LE theme: story + motion ===== */
#sv{background:radial-gradient(ellipse at 50% 25%,rgba(34,211,238,.2),rgba(2,4,14,.96) 70%),repeating-linear-gradient(0deg,rgba(34,211,238,.05) 0 1px,transparent 1px 4px);backdrop-filter:blur(14px)}
.svb{border-radius:22px;box-shadow:0 0 0 1px rgba(34,211,238,.6),0 0 40px rgba(34,211,238,.35),0 0 120px rgba(139,92,246,.3)}
.svb::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(transparent 46%,rgba(34,211,238,.14) 50%,transparent 54%) 0 0/100% 220%;animation:ss 4.5s linear infinite}@keyframes ss{to{background-position:0 -220%}}
.svb::after{content:"";position:absolute;inset:8px;z-index:5;pointer-events:none;border-radius:16px;background:linear-gradient(#22d3ee,#22d3ee) left top/24px 2px no-repeat,linear-gradient(#22d3ee,#22d3ee) left top/2px 24px no-repeat,linear-gradient(#22d3ee,#22d3ee) right top/24px 2px no-repeat,linear-gradient(#22d3ee,#22d3ee) right top/2px 24px no-repeat,linear-gradient(#22d3ee,#22d3ee) left bottom/24px 2px no-repeat,linear-gradient(#22d3ee,#22d3ee) left bottom/2px 24px no-repeat,linear-gradient(#22d3ee,#22d3ee) right bottom/24px 2px no-repeat,linear-gradient(#22d3ee,#22d3ee) right bottom/2px 24px no-repeat;filter:drop-shadow(0 0 4px #22d3ee);animation:fade .8s}
.svp{top:16px;left:18px;right:18px;gap:5px}.svp i{height:4px;transform:skewX(-24deg);background:rgba(34,211,238,.18)}.svp b{background:linear-gradient(90deg,#22d3ee,#8b5cf6);box-shadow:0 0 10px #22d3ee}
.svh{padding:34px 18px 26px;background:linear-gradient(rgba(2,6,20,.85),transparent);backdrop-filter:blur(2px)}.svh .av{box-shadow:0 0 0 2px #22d3ee,0 0 16px #22d3ee;animation:rp2 2.4s infinite}
.svt{left:16px;right:16px;padding:10px 14px;background:rgba(5,8,22,.55);border:1px solid rgba(34,211,238,.45);border-radius:14px;backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(34,211,238,.2);animation:tx .7s cubic-bezier(.2,.8,.2,1) .15s both}
.svt.big{left:0;right:0;background:none;border:0;box-shadow:none;backdrop-filter:none;font-size:1.7rem;text-shadow:0 0 18px #22d3ee,0 0 40px #8b5cf6}
@keyframes tx{from{opacity:0;transform:translateY(28px) scale(.95);filter:blur(10px);letter-spacing:.25em}}
.svc{background:rgba(5,8,22,.7);border:1px solid #22d3ee;box-shadow:0 0 12px rgba(34,211,238,.5)}
.svq button{background:rgba(5,8,22,.65);border:1px solid rgba(34,211,238,.45)}.svq button:hover{transform:translateY(-6px) scale(1.25);box-shadow:0 0 16px #22d3ee}
.svf input{border-color:rgba(34,211,238,.6)}.svf input:focus{outline:0;box-shadow:0 0 16px rgba(34,211,238,.6)}
.a-n{animation:kn .45s cubic-bezier(.2,.8,.2,1)}.a-p{animation:kp .45s cubic-bezier(.2,.8,.2,1)}
.sring{display:inline-block;border-radius:50%;padding:3px;background:conic-gradient(#22d3ee,#8b5cf6,#22d3ee);box-shadow:0 0 16px var(--c1);cursor:pointer;animation:rp2 2.2s infinite}.sring .av{border:3px solid var(--bg)}@keyframes rp2{50%{box-shadow:0 0 28px var(--c2)}}
.nbg{background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:3px;animation:pop .6s}
.box{animation:mi2 .55s cubic-bezier(.2,.9,.3,1.25);border-color:var(--c1);box-shadow:0 0 40px rgba(34,211,238,.3)}@keyframes mi2{from{opacity:0;transform:translateY(46px) scale(.85) rotateX(24deg);filter:blur(8px)}}
.box::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--c1),var(--c2),transparent);animation:sw 2.4s linear infinite}@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.card:not(.hero):not(.box)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(34,211,238,.14),transparent);transform:skewX(-20deg);pointer-events:none}.card:not(.hero):not(.box):hover::after{left:140%;transition:left .9s}
.card:hover{transform:translateY(-2px)}
.ph h2{animation:h2 .9s cubic-bezier(.2,.8,.2,1) both}@keyframes h2{from{clip-path:inset(0 100% 0 0);opacity:0;letter-spacing:.4em}}
.logo{animation:gl 6s infinite}.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55),transparent 70%);transform:translateX(-120%)}.btn:hover::after{transform:translateX(120%);transition:transform .6s}
#toast{border-radius:12px;box-shadow:0 0 22px rgba(34,211,238,.5);transition:.4s cubic-bezier(.2,1.4,.4,1)}
.tabs a.on{animation:pop .4s}.loreit,.chc{border-left:3px solid var(--c1)}.loreit p{line-height:1.9}

/* ===== rank animations ===== */
.nl{font-weight:600}.nl1{text-shadow:0 0 8px #34d399}
.nl2,.nl3,.nl4{background-clip:text;-webkit-background-clip:text;color:transparent;background-size:300% 100%;animation:fl2 3s linear infinite}
.nl2{background-image:linear-gradient(90deg,#60a5fa,#22d3ee,#60a5fa)}
.nl3{background-image:linear-gradient(90deg,#c084fc,#f0abfc,#818cf8,#c084fc);filter:drop-shadow(0 0 6px #a855f7);animation-duration:2.2s}
.nl4{background-image:linear-gradient(90deg,#fde047,#f97316,#fff,#fde047,#22d3ee,#fde047);font-weight:800;letter-spacing:.03em;animation:fl2 1.6s linear infinite,gl4 2s ease-in-out infinite}
@keyframes fl2{to{background-position:300% 0}}@keyframes gl4{0%,100%{filter:drop-shadow(0 0 6px #f5a70b)}50%{filter:drop-shadow(0 0 14px #fde047) drop-shadow(0 0 26px #f97316)}}
.bd{position:relative;overflow:hidden;display:inline-block;vertical-align:middle}
.b1{animation:bp 2.4s infinite}@keyframes bp{50%{box-shadow:0 0 10px currentColor}}
.b2::after,.b3::after,.b4::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7),transparent 70%);animation:bs 2.4s infinite}@keyframes bs{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.b2{box-shadow:0 0 8px #60a5fa}.b3{background:linear-gradient(90deg,rgba(192,132,252,.25),rgba(129,140,248,.25));box-shadow:0 0 12px #a855f7;animation:bp 1.8s infinite}.b3::after{animation-duration:1.8s}
.b4{background:linear-gradient(90deg,rgba(253,224,71,.3),rgba(249,115,22,.3));box-shadow:0 0 16px #f5a70b,0 0 30px rgba(249,115,22,.5);font-weight:700;animation:bp 1.4s infinite}.b4::before{content:"✦ "}.b4::after{animation-duration:1.4s}
.av.a2{box-shadow:0 0 0 2px #60a5fa}.av.a3{box-shadow:0 0 0 2px #c084fc,0 0 14px #a855f7;animation:av3 2.4s infinite}.av.a4{box-shadow:0 0 0 2px #fde047,0 0 22px #f97316;animation:av4 1.8s infinite}
@keyframes av3{50%{box-shadow:0 0 0 2px #f0abfc,0 0 26px #a855f7}}@keyframes av4{50%{box-shadow:0 0 0 3px #fff,0 0 34px #fde047,0 0 50px #f97316}}
.fsong{display:flex;flex-direction:column;gap:4px;margin:8px 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(34,211,238,.06)}
.rv:nth-child(odd){transform:translate(-28px,24px) scale(.98)}.rv:nth-child(even){transform:translate(28px,24px) scale(.98)}.rv.vis{transform:none}
nav a:hover{transform:translateY(-2px)}.sp{position:fixed;z-index:95;width:6px;height:6px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee;pointer-events:none;animation:spk .7s forwards}@keyframes spk{to{transform:translateY(24px) scale(0);opacity:0}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>

const img2url=(f,m,q)=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.src=URL.createObjectURL(f)});
async function put(c,id,o){o={...o,id};if(db){try{await db.doc(c+'/'+id).set(o);return true}catch(e){toast('บันทึกไม่สำเร็จ: บัญชีนี้ไม่มีสิทธิ์เขียนข้อมูล');return false}}const i=D[c].findIndex(x=>x.id===id);i<0?D[c].push(o):D[c][i]=o;ls('lx_'+c,D[c]);render();return true}

const modal=h=>{const m=$('#modal');if(!h){curStory=null;const o=m.firstChild;if(o&&!o.classList.contains('out')){o.classList.add('out');setTimeout(()=>{if(o.isConnected&&o.classList.contains('out'))m.innerHTML=''},180)}return}m.innerHTML=`<div class=ov data-ov><div class="box card">${h}</div></div>`};

const V={
home(){const me=U(),us=users(),ps=[...D.posts].sort((a,b)=>b.ts-a.ts);
