<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1d3a">
<title>LuminaEther Official</title><link rel="icon" id="fav">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--n1:#0b1d3a;--n2:#16345f;--n3:#2a5298;--bg:#f2f6fc;--fg:#0b1d3a;--card:#fff;--line:#c9d7ee;--mut:#5b6f93;--ac:#3b82f6}
@media(prefers-color-scheme:dark){:root{--bg:#07101f;--fg:#e6eefc;--card:#0f2040;--line:#25406e;--mut:#8da3c9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 'Noto Sans Thai',sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,#3b82f633,transparent 40%),radial-gradient(circle at 80% 60%,#2a529833,transparent 45%)}
#bg i{position:absolute;width:6px;height:6px;border-radius:50%;background:#60a5fa;opacity:.5;animation:fl linear infinite}
@keyframes fl{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(90deg,var(--n1),var(--n2));color:#fff;box-shadow:0 4px 20px #0005;animation:dn .8s both}
@keyframes dn{from{transform:translateY(-100%)}}
header img{height:42px;animation:glow 3s infinite;background:#fff;border-radius:50%;padding:2px}
@keyframes glow{50%{box-shadow:0 0 18px #60a5fa}}
.brand{font:700 1.05rem Cinzel,serif;letter-spacing:.18em;cursor:pointer;white-space:nowrap}.brand small{display:block;font-size:.55rem;letter-spacing:.5em;opacity:.7}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}nav a{color:#cfe0ff;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;position:relative;transition:.3s}
nav a:hover,nav a.on{color:#fff;background:#ffffff1f}nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#60a5fa;animation:ul .4s}
@keyframes ul{from{transform:scaleX(0)}}
.btn{border:0;border-radius:10px;padding:9px 18px;font:600 14px 'Noto Sans Thai';cursor:pointer;background:linear-gradient(90deg,var(--n3),var(--ac));color:#fff;transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px #3b82f666}.btn.g{background:transparent;border:1px solid currentColor}.sm{padding:5px 12px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:22px 16px 70px;animation:pg .6s both}@keyframes pg{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;transition:.35s}.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #1e40af26;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid>.card{margin:0}
h2{font:700 1.5rem Cinzel,'Noto Sans Thai',serif;margin:6px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sp span{display:inline-block;white-space:pre;opacity:0;transform:translateY(.6em) rotateX(70deg);animation:ch .6s forwards;animation-delay:calc(var(--i)*35ms)}
@keyframes ch{to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s,box-shadow .35s,border-color .35s;transition-delay:calc(var(--d,0)*90ms)}.rv.in{opacity:1;transform:none}
.hero{text-align:center;padding:34px 10px;border-radius:22px;background:linear-gradient(135deg,var(--n1),var(--n3));color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,#60a5fa44,transparent 30%);animation:rot 12s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.hero>*{position:relative}.hero img{width:170px;max-width:46vw;background:#fff;border-radius:50%;animation:flt 5s ease-in-out infinite;box-shadow:0 0 40px #60a5fa88}@keyframes flt{50%{transform:translateY(-12px)}}
.hero h1{font:700 clamp(1.6rem,6vw,2.8rem) Cinzel,serif;letter-spacing:.14em;margin:14px 0 4px}.hero p{margin:4px 0;opacity:.9}
.auth{max-width:380px;margin:18px auto 0;text-align:left;background:#ffffff14;border:1px solid #ffffff33;border-radius:16px;padding:16px;backdrop-filter:blur(8px)}
label{display:block;font-size:13px;margin:8px 0}input,textarea,select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#0b1d3a;font:inherit;margin-top:3px}
.org{display:flex;flex-direction:column;align-items:center;gap:10px}.board{background:linear-gradient(90deg,var(--n1),var(--n3));color:#fff;padding:14px 30px;border-radius:14px;text-align:center;cursor:pointer;animation:glow 3s infinite}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;width:100%}.unit h3{margin:0 0 4px;color:var(--ac)}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}.dep{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:.3s;font-size:13px}.dep:hover{background:var(--n3);color:#fff;transform:scale(1.06)}
.dep b{display:block;font-size:20px}.mut{color:var(--mut);font-size:13px}.bd{font-size:11px;padding:1px 9px;border-radius:99px;background:var(--n3);color:#fff}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--n3),var(--ac));color:#fff;font-weight:700;font-size:20px;flex:none}.row{display:flex;gap:10px;align-items:center}
.ov{position:fixed;inset:0;z-index:50;background:#020a1ccc;display:grid;place-items:center;padding:16px;animation:pg .3s}.ov .card{max-width:440px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--n1);color:#fff;padding:10px 20px;border-radius:99px;transition:.4s;z-index:99}#toast.on{transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);padding:20px;font-size:12px}
</style></head><body><div id="bg"></div>
<header><img data-logo alt="logo"><div class="brand" data-go="home">LUMINAETHER<small>OFFICIAL</small></div><nav id="nav"></nav><div id="me"></div></header>
<main id="v"></main><div id="modal"></div><div id="toast"></div><footer>LuminaEther Official · Non-Profit Organization · Knowledge · Society · Future</footer>

const modal=h=>{$('#modal').innerHTML=h?`<div class="ov" data-ov><div class="card">${h}</div></div>`:''};
const fld=(n,l,t='text',x='')=>t==='t'?`<label>${l}<textarea name=${n} rows=3 ${x}></textarea></label>`:`<label>${l}<input name=${n} type=${t} ${x}></label>`;
const authF=reg=>`<form data-f="${reg?'reg':'login'}"><b>${reg?'สมัครสมาชิก':'เข้าสู่ระบบ'}</b>${reg?fld('name','ชื่อ','text','required maxlength=24')+fld('xbox','Xbox Gamertag','text','required maxlength=20'):''}${fld('email','Email','email','required')}${fld('pw','รหัสผ่าน','password','required minlength=6')}${reg?fld('pw2','รหัสผ่าน (ยืนยัน)','password','required'):''}<div class="row" style="margin-top:10px"><button class="btn">ตกลง</button><a data-a="${reg?'li':'rg'}" style="cursor:pointer;font-size:13px;text-decoration:underline">${reg?'มีบัญชีแล้ว?':'สมัครสมาชิก'}</a></div></form>`;
const dep=u=>`<div class="card unit rv"><h3>${DEP[u].t}</h3><div class="mut">${DEP[u].d}</div><div class="deps">${DEP[u].l.map(([i,n,d])=>`<div class="dep" data-a="dep" data-t="${esc(n)}" data-d="${esc(d)}"><b>${i}</b>แผนก${n}</div>`).join('')}</div></div>`;
const hd=t=>`<h2><span class="sp">${esc(t)}</span></h2>`,plus=k=>lv()>=CFG[k].lv?`<button class="btn sm" data-a="add" data-k="${k}">＋ เพิ่ม</button>`:'';
const delB=(k,id)=>lv()>=CFG[k].lv?`<button class="btn g sm" data-a="del" data-k="${k}" data-id="${id}">ลบ</button>`:'';
const P={
home:()=>`<div class="hero"><img data-logo alt=""><h1 class="sp">LUMINAETHER</h1><p>องค์กรเพื่อสังคม แบ่งปันความรู้ สร้างอนาคตที่ดีกว่า</p><p style="opacity:.7">ไม่แสวงหาผลกำไร | มุ่งพัฒนา | เพื่อสังคม</p></div>
<h2><span class="sp">ยินดีต้อนรับ ${esc(me()?.name||'')}</span></h2><div class="grid">${NAV.slice(1).map(([k,i,t],n)=>`<div class="card rv" style="--d:${n}" data-go="${k}" role="button"><div style="font-size:30px">${i}</div><b>${t}</b></div>`).join('')}</div>`,
about:()=>`${hd('เกี่ยวกับเรา')}<div class="card rv"><p>LuminaEther Official คือองค์กรเอกชนไม่แสวงหากำไร ที่มุ่งเน้นการแบ่งปันความรู้ และการพัฒนาสังคมอย่างยั่งยืน ผ่านการดำเนินงานในด้านต่างๆ ทั้งภายในและภายนอกองค์กร ด้วยความโปร่งใส เป็นธรรม และมีจริยธรรม</p></div><div class="grid">${['ไม่แสวงหากำไรในสิ่งที่ผิดศีลธรรม','มอบความรู้ในสิ่งที่ควรรู้','พัฒนาสังคมและชุมชน','สร้างโอกาสให้ทุกคน'].map((t,i)=>`<div class="card rv" style="--d:${i}">✦ ${t}</div>`).join('')}</div><div class="card rv" style="text-align:center"><i>“ความรู้คือพลังที่ยิ่งใหญ่ และเราจะส่งต่อมันให้กับทุกคน”</i></div>`,
units:()=>`${hd('โครงสร้างองค์กร')}<div class="org"><div class="board rv" data-go="board"><b>คณะบริหาร (Executive Board)</b><br><small>กำหนดนโยบาย / บริหารงาน / ดูแลภาพรวม</small></div><div class="units">${dep('A')}${dep('B')}</div><div class="card rv" style="width:100%"><b>🌐 การพัฒนาเทคโนโลยีและนวัตกรรม</b><div class="mut">เว็บไซต์ · แอปพลิเคชัน · เกม — สร้างระบบออนไลน์เพื่อความสะดวกและเข้าถึงได้มากขึ้น</div></div></div>`,
shop:()=>`<h2><span class="sp">สินค้า &amp; บริการ</span>${plus('shop')}</h2><div class="grid">${[...D.products].sort((a,b)=>b.ts-a.ts).map((o,i)=>`<div class="card rv" style="--d:${i%6}"><h3>${esc(o.name)}</h3><b>${esc(o.price||'')}</b><p>${esc(o.desc||'')}</p>${delB('shop',o.id)}</div>`).join('')||'<div class="card mut">ยังไม่มีรายการ</div>'}</div>`,
news:()=>`<h2><span class="sp">ข่าวสาร</span>${plus('news')}</h2>${[...D.news].sort((a,b)=>b.ts-a.ts).map(o=>`<div class="card rv"><h3>${esc(o.title)}</h3><p style="white-space:pre-wrap">${esc(o.desc||'')}</p><div class="mut">${ago(o.ts)}</div>${delB('news',o.id)}</div>`).join('')||'<div class="card mut">ยังไม่มีข่าว</div>'}`,
rules:()=>`<h2><span class="sp">กฎระเบียบ</span>${plus('rules')}</h2>${[...D.rules].sort((a,b)=>a.ts-b.ts).map(o=>`<div class="card rv"><span class="bd">${esc(o.cat||'ทั่วไป')}</span><h3>${esc(o.title)}</h3><p style="white-space:pre-wrap">${esc(o.desc||'')}</p>${o.pen?`<p><b>โทษ:</b> ${esc(o.pen)}</p>`:''}${delB('rules',o.id)}</div>`).join('')||'<div class="card mut">ยังไม่มีกฎ</div>'}`,
team:()=>mem('สมาชิกภายในทีมงาน',u=>u.lv>=1),board:()=>mem('สมาชิกคณะบริหาร',u=>u.lv>=2),
contact:()=>`${hd('ติดต่อเรา')}<div class="card rv"><form data-f="tk">${fld('sub','หัวข้อ','text','required')}${fld('text','ข้อความถึงทีมงาน','t','required')}<button class="btn" style="margin-top:8px">ส่งข้อความ</button></form></div>${lv()>=1?`<h2 style="font-size:1.1rem">กล่องข้อความ</h2>${[...D.tickets].sort((a,b)=>b.ts-a.ts).map(t=>`<div class="card rv"><b>${esc(t.sub)}</b><p>${esc(t.text)}</p><div class="mut">${esc(D.users.find(u=>u.id===t.by)?.name||'')} · ${ago(t.ts)}</div></div>`).join('')||'<div class="mut">ไม่มีข้อความ</div>'}`:''}`};
function mem(t,f){return `${hd(t)}<div class="grid">${D.users.filter(u=>!u.ban&&!u.bl&&f(u)).sort((a,b)=>b.lv-a.lv).map((u,i)=>`<div class="card rv" style="--d:${i%6}"><div class="row"><div class="av">${esc((u.name||'?')[0])}</div><div><b>${esc(u.name)} (${esc(u.xbox)})</b><br><span class="bd">${LV[u.lv|0]}</span></div></div>${lv()===4&&u.id!==sess?`<label>ระดับ<select data-a="setlv" data-id="${u.id}">${LV.map((l,n)=>`<option value=${n} ${n===u.lv?'selected':''}>${l}</option>`).join('')}</select></label>`:''}</div>`).join('')||'<div class="card mut">ยังไม่มีข้อมูล</div>'}</div>`}
function split(){document.querySelectorAll('.sp').forEach(e=>{if(e.dataset.s)return;e.dataset.s=1;const g=[...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(e.textContent)].map(x=>x.segment);e.innerHTML=g.map((c,i)=>`<span style="--i:${i}">${esc(c)}</span>`).join('')})}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
function render(){const u=me();
$('#nav').innerHTML=u?NAV.map(([k,i,t])=>`<a data-go="${k}" class="${page===k?'on':''}">${i} ${t}</a>`).join(''):'';
$('#me').innerHTML=u?`<span class="bd" style="background:#fff3;white-space:nowrap">${esc(u.name)} · ${LV[u.lv|0]}</span> <button class="btn g sm" data-a="out" style="color:#fff">ออก</button>`:'';
const v=$('#v');v.style.animation='none';void v.offsetWidth;v.style.animation='';
if(booting)v.innerHTML='<div class="hero"><h1 class="sp">LOADING...</h1></div>';
else if(!u)v.innerHTML=`<div class="hero"><img data-logo alt=""><h1 class="sp">LUMINAETHER</h1><p class="sp">องค์กรเพื่อสังคม แบ่งปันความรู้ สร้างอนาคตที่ดีกว่า</p><div class="auth" id="af">${authF(false)}</div><p style="opacity:.75">🔒 เข้าสู่ระบบเพื่อดูหน้าต่างอื่นๆ ทั้งหมด</p></div>`;
else v.innerHTML=(P[page]||P.home)();
document.querySelectorAll('img[data-logo]').forEach(i=>i.src=LOGO);$('#fav').href=LOGO;split();document.querySelectorAll('.rv').forEach(e=>io.observe(e))}
const go=p=>{page=p;render();scrollTo(0,0)};
document.addEventListener('click',async e=>{if(e.target.dataset.ov!==undefined)return modal();const t=e.target.closest('[data-go],[data-a]');if(!t)return;
if(t.dataset.go)return go(t.dataset.go);const a=t.dataset.a;
if(a==='rg'||a==='li')$('#af').innerHTML=authF(a==='rg');
else if(a==='out'){await SB.auth.signOut();sess=null;page='home';render()}
else if(a==='dep')modal(`<h3>แผนก${esc(t.dataset.t)}</h3><p>${esc(t.dataset.d)}</p><button class="btn" data-a="x">ปิด</button>`);
else if(a==='x')modal();
else if(a==='add'){const g=CFG[t.dataset.k];modal(`<form data-f="add" data-k="${t.dataset.k}"><h3>เพิ่มรายการ</h3>${g.f.map(([n,l,ty],i)=>fld(n,l,ty,i===0?'required':'')).join('')}<div class="row" style="margin-top:10px"><button class="btn">บันทึก</button><button type="button" class="btn g" data-a="x">ยกเลิก</button></div></form>`)}
else if(a==='del'&&confirm('ลบรายการนี้?')){await del(CFG[t.dataset.k].c,t.dataset.id);render()}});
document.addEventListener('change',async e=>{if(e.target.dataset.a==='setlv'){const u=D.users.find(x=>x.id===e.target.dataset.id);if(u&&await put('users',u.id,{...u,lv:+e.target.value}))toast('ปรับระดับแล้ว')}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),k=e.target.dataset.f;
if(k==='login'){const{data,error}=await SB.auth.signInWithPassword({email:f.get('email').trim().toLowerCase(),password:f.get('pw')});if(error)return toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง');if(await enter(data.user)){toast('ยินดีต้อนรับ!');render()}}
else if(k==='reg'){if(f.get('pw')!==f.get('pw2'))return toast('รหัสผ่านไม่ตรงกัน');const x=f.get('xbox').trim();try{const{data:tk}=await SB.rpc('xbox_taken',{x});if(tk)return toast('Xbox นี้ถูกใช้แล้ว')}catch(_){}
const{data,error}=await SB.auth.signUp({email:f.get('email').trim().toLowerCase(),password:f.get('pw'),options:{data:{name:f.get('name').trim(),xbox:x}}});if(error)return toast('สมัครไม่สำเร็จ: '+error.message);if(!data.session)return toast('กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ');if(await enter(data.user))render()}
else if(k==='add'){const g=CFG[e.target.dataset.k],o={by:sess,ts:Date.now()};g.f.forEach(([n])=>o[n]=(f.get(n)||'').trim());if(await put(g.c,nid(),o)){modal();render()}}
else if(k==='tk'){if(await put('tickets',nid(),{by:sess,sub:f.get('sub'),text:f.get('text'),ts:Date.now()})){toast('ส่งข้อความแล้ว');e.target.reset();render()}}});
(()=>{const b=$('#bg');for(let i=0;i<22;i++){const d=document.createElement('i');d.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;b.appendChild(d)}})();
render();(async()=>{try{const{data}=await SB.auth.getSession();if(data.session)await enter(data.session.user)}catch(e){console.error(e)}booting=false;render();setInterval(()=>sess&&pull().catch(()=>{}),30000)})();
</script></body></html>
